# Netlify: Build-Einstellungen, Sicherheits- und Cache-Header
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Dateien mit Hash im Namen ändern sich nie: ein Jahr cachen
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Spanisch, Französisch und Georgisch sind seit Okt. 2026 entfernt: auf die englische Seite umleiten.
# Die Slugs dieser Sprachen waren die englischen, daher passt :splat.
# Die nackten Pfade (/es, /fr, /ka) stehen extra, damit sie sicher auf die Startseite führen.
[[redirects]]
  from = "/es"
  to = "/"
  status = 301

[[redirects]]
  from = "/fr"
  to = "/"
  status = 301

[[redirects]]
  from = "/ka"
  to = "/"
  status = 301

[[redirects]]
  from = "/es/*"
  to = "/:splat"
  status = 301

[[redirects]]
  from = "/fr/*"
  to = "/:splat"
  status = 301

[[redirects]]
  from = "/ka/*"
  to = "/:splat"
  status = 301

# Englisch ist seit Okt. 2026 Standardsprache unter "/", Deutsch unter "/de/".
# Alte URLs dauerhaft umleiten.
[[redirects]]
  from = "/en/kontakt"
  to = "/contact"
  status = 301

[[redirects]]
  from = "/en/ueber-temo"
  to = "/about"
  status = 301

[[redirects]]
  from = "/en/*"
  to = "/:splat"
  status = 301

[[redirects]]
  from = "/kontakt"
  to = "/de/kontakt"
  status = 301

[[redirects]]
  from = "/ueber-temo"
  to = "/de/ueber-temo"
  status = 301

[[redirects]]
  from = "/impressum"
  to = "/de/impressum"
  status = 301

[[redirects]]
  from = "/datenschutz"
  to = "/de/datenschutz"
  status = 301

[[redirects]]
  from = "/danke"
  to = "/de/danke"
  status = 301
